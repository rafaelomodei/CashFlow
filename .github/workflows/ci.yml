# Pipeline de CI — testing-strategy.md §5.
#
# Dois jobs por decisão: unitários e arquitetura formam o gate rápido, que falha
# em segundos. Integração usa Testcontainers e roda separado para não atrasar o
# primeiro sinal.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  fast-gate:
    name: Build, unitários e arquitetura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CashFlow.sln

      - name: Build
        run: dotnet build CashFlow.sln --no-restore --configuration Release

      - name: Testes unitários
        run: >
          dotnet test CashFlow.sln --no-build --configuration Release
          --filter Category=Unit --logger "trx;LogFileName=unit.trx"

      - name: Testes de arquitetura
        run: >
          dotnet test CashFlow.sln --no-build --configuration Release
          --filter Category=Architecture --logger "trx;LogFileName=architecture.trx"

      # Guarda contra lacuna silenciosa: um teste que esqueça o `[Trait]` não
      # rodaria em nenhum dos jobs acima e seria ignorado sem ninguém perceber.
      - name: Testes sem categoria
        run: >
          dotnet test CashFlow.sln --no-build --configuration Release
          --filter "Category!=Unit&Category!=Architecture&Category!=Integration"
          --logger "trx;LogFileName=uncategorized.trx"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fast-gate
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Roda em paralelo ao gate rápido, e não depois: o frontend não compartilha
  # nada com a solution .NET, então encadeá-los só atrasaria o sinal de um deles.
  frontend:
    name: Frontend — tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm run test

      # `npm run build` roda `tsc --noEmit` antes do bundle: um DTO que divergir
      # do contrato quebra aqui, e não na tela.
      - name: Build
        run: npm run build

  integration:
    name: Testes de integração
    runs-on: ubuntu-latest
    needs: fast-gate
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CashFlow.sln

      - name: Build
        run: dotnet build CashFlow.sln --no-restore --configuration Release

      # O runner do GitHub já traz Docker — pré-requisito do Testcontainers (ADR-008).
      - name: Testes de integração
        run: >
          dotnet test CashFlow.sln --no-build --configuration Release
          --filter Category=Integration --logger "trx;LogFileName=integration.trx"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
