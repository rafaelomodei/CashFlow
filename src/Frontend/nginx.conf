# Reverse proxy de mesma origem — ADR-015.
#
# O browser conhece apenas a origem do frontend. `/api/cashflow` e
# `/api/consolidation` são encaminhados aqui dentro, de modo que nenhum endereço
# de serviço chega ao bundle e não há CORS a configurar em nenhuma das APIs.
#
# Isto é um reverse proxy, não um BFF: não há agregação, transformação de
# payload ou regra de negócio. Uma linha de lógica aqui dentro tornaria isto um
# terceiro serviço no caminho crítico, e exigiria ADR nova.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O DNS embutido do Docker, consultado a cada requisição.
    #
    # Com um nome literal em `proxy_pass`, o nginx resolve na carga da
    # configuração e **não sobe** se a API estiver fora do ar — o oposto do que
    # a ADR promete. Resolvendo por variável, o frontend sobe sozinho e uma API
    # ausente vira 502 naquela região da tela, que é o comportamento correto.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~ ^/api/cashflow/(.*)$ {
        set $cashflow_upstream http://cashflow-api:8080;
        proxy_pass $cashflow_upstream/$1$is_args$args;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location ~ ^/api/consolidation/(.*)$ {
        set $consolidation_upstream http://consolidation-api:8080;
        proxy_pass $consolidation_upstream/$1$is_args$args;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Assets com hash no nome podem ser cacheados agressivamente; o index.html
    # não, ou um deploy novo continuaria servindo o bundle antigo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
